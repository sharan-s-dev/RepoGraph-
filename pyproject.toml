[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repograph"
version = "1.1.0"
description = "Fast, deterministic codebase architecture explorer + Google Gemma open-weight AI architect engine."
readme = "README.md"
authors = [
    { name = "Sharan S" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["architecture", "ast", "dependency-graph", "visualization", "mermaid", "code-analysis", "gemma", "gemma2", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sharan-s-dev/RepoGraph-"
Documentation = "https://sharan-s-dev.github.io/RepoGraph-/"
Repository = "https://github.com/sharan-s-dev/RepoGraph-"
Issues = "https://github.com/sharan-s-dev/RepoGraph-/issues"

[project.scripts]
repograph = "repograph:main"

[tool.setuptools]
py-modules = ["repograph"]
