name: "Bug Report"
description: "File an issue describing a bug or unexpected behavior in RepoGraph."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "e.g., Python 3.11.2"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "e.g., Windows 11 / Ubuntu 22.04 / macOS Sonoma"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: "A clear and concise description of what happened."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: "Provide steps, directory structure, or minimal code snippet to reproduce."
      placeholder: |
        1. Run `python repograph.py ./my-repo`
        2. Inspect output
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: "A clear description of what you expected to happen."
    validations:
      required: true
